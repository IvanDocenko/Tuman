# Loaded before Gecko starts. Do not move these to late session initialization.
prefs:
  toolkit.telemetry.enabled: false
  toolkit.telemetry.unified: false
  toolkit.telemetry.archive.enabled: false
  toolkit.telemetry.server: ""
  toolkit.telemetry.newProfilePing.enabled: false
  toolkit.telemetry.shutdownPingSender.enabled: false
  toolkit.telemetry.updatePing.enabled: false
  toolkit.telemetry.bhrPing.enabled: false
  toolkit.telemetry.firstShutdownPing.enabled: false
  toolkit.telemetry.user_characteristics_ping.current_version: 0
  datareporting.healthreport.uploadEnabled: false
  datareporting.policy.dataSubmissionEnabled: false
  datareporting.usage.uploadEnabled: false
  telemetry.fog.test.localhost_port: -1
  browser.crashReports.unsubmittedCheck.autoSubmit2: false
  browser.tabs.crashReporting.sendReport: false
  media.peerconnection.enabled: false
  media.navigator.enabled: false
  network.dns.disablePrefetch: true
  network.dns.disablePrefetchFromHTTPS: true
  network.prefetch-next: false
  network.predictor.enabled: false
  network.http.speculative-parallel-limit: 0
  network.trr.mode: 3
  network.trr.uri: "https://mozilla.cloudflare-dns.com/dns-query"
  network.trr.bootstrapAddress: "1.1.1.1"
  network.trr.confirmationNS: "skip"
  network.trr.excluded-domains: ""
  network.trr.builtin-excluded-domains: ""
  network.trr.allow-rfc1918: false
  network.trr.use-application-dns-canary: false
  network.captive-portal-service.enabled: false
  network.connectivity-service.enabled: false
  dom.security.https_only_mode: true
  dom.security.https_only_mode_send_http_background_request: false
  security.mixed_content.block_active_content: true
  security.mixed_content.block_display_content: true
  security.enterprise_roots.enabled: false
  dom.push.enabled: false
  geo.enabled: false
  privacy.globalprivacycontrol.enabled: true
  privacy.trackingprotection.enabled: true
  privacy.trackingprotection.pbmode.enabled: true
  privacy.trackingprotection.socialtracking.enabled: true
  privacy.trackingprotection.cryptomining.enabled: true
  privacy.trackingprotection.fingerprinting.enabled: true
  # With no network-state permission, socket results decide reachability.
  network.manage-offline-status: false
